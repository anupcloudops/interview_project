trigger:
  branches:
    include:
      - main
      - features/*

pool: asr

stages:
  - stage: infra_build

    jobs:
      - job: terraform_plan

        steps:

        - task: TerraformInstaller@1
          displayName: 'Install Terraform'
          inputs:
            terraformVersion: 'latest'
        - task: DownloadSecureFile@1
          name: tfvars
          inputs:
            secureFile: 'terraform.tfvars'
        - task: Bash@3
          inputs:
            targetType: 'inline'
            script: 'cp "$(tfvars.secureFilePath)" "$(System.DefaultWorkingDirectory)/env/dev/terraform.tfvars"'

        - task: TerraformTask@5
          displayName: 'Terraform Init'
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            backendServiceArm: 'svc_test'
            backendAzureRmResourceGroupName: 'resttest'
            backendAzureRmStorageAccountName: 'regtrwser'
            backendAzureRmContainerName: 'rtsrs'
            backendAzureRmKey: 'terraform.tfstate'

        - task: TerraformTask@5
          displayName: 'Terraform Validate'
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'

        - task: TerraformTask@5
          displayName: 'Terraform Plan'
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            environmentServiceNameAzureRM: 'svc_test'

      - job: terraform_apply
        dependsOn: terraform_plan
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            backendServiceArm: 'svc_test'
            backendAzureRmResourceGroupName: 'resttest'
            backendAzureRmStorageAccountName: 'regtrwser'
            backendAzureRmContainerName: 'rtsrs'
            backendAzureRmKey: 'terraform.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
            commandOptions: '-auto-approve'
            environmentServiceNameAzureRM: 'svc_test'
