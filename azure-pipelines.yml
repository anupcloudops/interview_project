trigger:
 branches:
  include:
    - main
    - features/*

pool: asr

stages:
  - stage: infra_build
    jobs:
      - job: terraform_validate
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'
